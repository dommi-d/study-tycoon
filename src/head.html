<title>Study Stakes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Concept: solarpunk golden hour, turned up. Saturated sky, dark teal-and-ocean panels edged in gold, candy-bright business cards, and a cel-shaded island with ink outlines. */
:root{--bg:#29b6c8;--txt:#fff4d6;--mute:#9ee6cf;--line:rgba(255,194,26,.6);--gold:#ffc21a;--gold-d:#b35a00;--gold-ink:#3a1b00;--teal:#17d6c0;--coral:#ff5a4a;--win:#7dffb0;--loss:#ff9a8a;--card:#fff8e6;--cardink:#14352a;--red:#e0342b;--feltline:rgba(255,255,255,.25);--disp:'Lilita One','Nunito',system-ui,sans-serif;--body:'Nunito',system-ui,sans-serif;--r:22px;color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:linear-gradient(180deg,#1478d4 0,#29b6c8 34%,#ffb13b 80%,#ff6a5c 100%);background-attachment:fixed;color:var(--txt);font:700 15px/1.45 var(--body);padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#1478d4;z-index:30}
.wrap{max-width:1080px;margin:0 auto}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-top:10px;background:linear-gradient(180deg,rgba(7,76,84,.95),rgba(8,50,88,.95));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:3px solid var(--gold);border-radius:99px;box-shadow:0 5px 0 rgba(0,0,0,.35),0 14px 30px rgba(0,30,50,.4);display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 20px;flex-wrap:wrap}
.brand{font:400 26px/1 var(--disp);letter-spacing:.01em;background:linear-gradient(90deg,#ffe066,#ff9a2e);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;margin-top:4px;font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase;-webkit-text-fill-color:var(--mute)}
.bal{text-align:right;display:flex;align-items:center;gap:10px}
.bal .sun{border:0;padding:0;cursor:pointer}.bal .sun:hover{filter:brightness(1.08)}.bal .sun:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bal i,.bal .sun{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a8,var(--gold) 55%,var(--gold-d));box-shadow:0 3px 0 var(--gold-d),inset 0 -3px 0 rgba(0,0,0,.15);display:grid;place-items:center;font:400 19px var(--disp);color:var(--gold-ink);font-style:normal}
.bal b{display:block;font:400 30px/1 var(--disp);color:#ffe066;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.bal span{display:block;font:800 10px var(--body);color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.bal.up b{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.2);color:#fff}}
.hero{position:relative;height:clamp(270px,46vw,440px);margin:6px 0 0;touch-action:pan-y;cursor:grab}
.hero:active{cursor:grabbing}
#stage,#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-hud{position:absolute;left:8px;bottom:8px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
h2{font:400 15px var(--disp);letter-spacing:.08em;text-transform:uppercase;color:#ffd34d;margin:0 0 12px}
.desk{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin:14px 0 22px}
.panel{background:linear-gradient(160deg,rgba(9,108,102,.95),rgba(10,66,124,.95));border:3px solid rgba(255,194,26,.75);border-radius:var(--r);padding:20px;min-width:0;box-shadow:0 8px 0 rgba(0,0,0,.3),0 20px 40px rgba(0,25,45,.35)}
.clock{font:400 clamp(40px,9vw,64px)/1 var(--disp);font-variant-numeric:tabular-nums;color:var(--txt);text-shadow:0 3px 0 rgba(0,0,0,.35)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mute{color:var(--mute)}
.mono{font-variant-numeric:tabular-nums}
.btn{font:400 16px var(--disp);letter-spacing:.01em;border:2px solid #7ff3e6;background:linear-gradient(180deg,#3fe6d2,#14b3a0);color:#032f2a;padding:9px 18px;border-radius:14px;cursor:pointer;min-height:42px;box-shadow:0 4px 0 #0a7d70,0 8px 14px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #0a7d70}
.btn.primary{background:linear-gradient(180deg,#ffe066,#ffab1f);border-color:#ffe99a;color:var(--gold-ink);box-shadow:0 4px 0 var(--gold-d),0 8px 14px rgba(0,0,0,.3)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--gold-d)}
.btn.stop{background:linear-gradient(180deg,#ff8a73,#ff4a38);border-color:#ffb3a5;color:#fff;box-shadow:0 4px 0 #a82618,0 8px 14px rgba(0,0,0,.3)}
.btn.sm{padding:5px 12px;min-height:34px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #ffe066;outline-offset:2px}
input[type=text],input[type=number]{font:700 15px var(--body);background:#05303a;color:var(--txt);border:2px solid #1fb7a6;border-radius:12px;padding:9px 12px;min-width:0}
input::placeholder{color:#6fb8ad}
.meter{height:18px;background:#05303a;border:2px solid #1fb7a6;border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:repeating-linear-gradient(45deg,#ffc21a 0 10px,#ff8a1f 10px 20px);width:0;transition:width .4s;border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:rgba(0,0,0,.28);border-radius:16px;padding:10px 12px;border:2px solid rgba(255,255,255,.12)}
.stat b{display:block;font:400 23px var(--disp);color:#ffe066}
.stat span{font-size:12px;color:var(--mute)}
.tag{font:400 14px var(--disp);padding:5px 13px;border-radius:99px;background:linear-gradient(180deg,#ffe066,#ffb01f);border:2px solid #fff0a8;color:#4a2400;box-shadow:0 3px 0 var(--gold-d)}
ul.tasks{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.tasks li{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 10px}
.tasks li.done span{text-decoration:line-through;color:var(--mute)}
.tasks li span{flex:1;min-width:0;overflow-wrap:anywhere}
.tasks input[type=checkbox]{width:22px;height:22px;accent-color:#ffc21a}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{font:400 17px var(--disp);padding:10px 22px;border-radius:99px;border:2px solid rgba(255,194,26,.6);background:rgba(6,60,74,.85);color:var(--txt);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.tab[aria-selected=true]{background:linear-gradient(180deg,#ffe066,#ffab1f);border-color:#fff0a8;color:var(--gold-ink);box-shadow:0 4px 0 var(--gold-d)}
.floor{background:linear-gradient(165deg,#0c3b8f,#0e7f93 52%,#14b36c);border:4px solid var(--gold);border-radius:28px;padding:20px;min-height:360px;color:#fff;box-shadow:0 10px 0 #7a4a00,0 24px 44px rgba(0,25,45,.45)}
.floor h2{color:#ffe066}
.floor .mute{color:#c9f5e6}
#p-bj,#p-vp{background:radial-gradient(ellipse at 50% 20%,#17a35a,#064d2c 78%);border:3px solid rgba(255,214,102,.75);border-radius:22px;padding:18px;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
.biz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.biz{--c:#ff9a3d;--c2:#ff6a2b;--tc:#3a1500;background:linear-gradient(165deg,var(--c),var(--c2));color:var(--tc);border:3px solid rgba(0,0,0,.25);border-radius:20px;padding:14px;display:grid;gap:7px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.biz:nth-child(2){--c:#4cc3ff;--c2:#1f7fe0;--tc:#021c3a}.biz:nth-child(3){--c:#ffd23f;--c2:#ffa91f;--tc:#3a2400}.biz:nth-child(4){--c:#2ee6c8;--c2:#14a89a;--tc:#022b27}.biz:nth-child(5){--c:#5be68a;--c2:#1fae5a;--tc:#022b14}.biz:nth-child(6){--c:#cdf252;--c2:#8fc21f;--tc:#1f2e00}
.biz h3{margin:0;font:400 19px/1.2 var(--disp)}
.biz .own{font:400 30px/1 var(--disp);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.biz .mute{color:var(--tc);opacity:.8}
.biz .btn.primary{background:linear-gradient(180deg,#34285a,#171030);border-color:#6a55b0;color:#ffe066;box-shadow:0 4px 0 #000}
.mk{background:rgba(3,34,54,.85);color:var(--txt);border:2px solid rgba(255,194,26,.55);border-radius:20px;padding:14px;display:grid;gap:8px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.mp:empty{display:none}.mp .pr{padding:6px 0;border-top:1px dashed rgba(255,255,255,.2);display:grid;gap:3px}
.tdcard{--c:#fff;text-align:left;display:grid;gap:3px;border:3px solid var(--c);background:rgba(3,34,54,.8);color:#fff;border-radius:16px;padding:10px 12px;cursor:pointer;font:400 14px var(--body,inherit)}
.tdcard b{font:400 17px var(--disp);color:var(--c)}.tdcard em{font-style:normal;font-size:12px;color:#ffe066}.tdcard small{font-size:12px;opacity:.85}
.tdcard.on{background:rgba(255,255,255,.2);box-shadow:0 0 0 3px #fff}
.td-shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tdframe{border:3px solid #ffc21a;border-radius:22px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.3);background:#0b3550}
.tdhud{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;background:#ffc21a}
.tdt{background:linear-gradient(180deg,#0e4a63,#082f48);color:#fff;padding:10px 14px;display:grid;gap:2px;position:relative;min-width:0}
.tdt .k{font:800 11px var(--body,inherit);letter-spacing:.1em;text-transform:uppercase;color:#bfe9ff;display:flex;align-items:center;gap:6px}
.tdt .v{font:400 40px/1 var(--disp);font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.tdt .s{font-size:12px;color:#c9f5e6}
.tdt .tb{height:7px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:3px}.tdt .tb i{display:block;height:100%;border-radius:9px}
.tdt.life .v{color:#ff8fa3}.tdt.life .tb i{background:linear-gradient(90deg,#ff5a7a,#ff9ab0)}
.tdt.ammo .v{color:#ffe066}.tdt.ammo .tb i{background:linear-gradient(90deg,#ffc21a,#fff0a0)}
.tdt.ammo.low .v{color:#ff7a66;animation:tdlow 1s infinite}
.tdt.prize .v{color:#6df3c0}.tdt.prize.solar{background:linear-gradient(180deg,#8a4b00,#4d2a00)}.tdt.prize.solar .v{color:#ffd23f}
.tdt.wave .v{color:#9fe8ff}
.tdpause{position:absolute;right:10px;top:10px;z-index:2;font-size:15px;padding:7px 14px;min-height:38px}
.tdt .buy{position:absolute;right:10px;top:10px;font:400 13px var(--disp);padding:4px 10px;border-radius:10px;border:2px solid #fff3a0;background:linear-gradient(180deg,#ffe066,#ffab1f);color:#3a2400;cursor:pointer;box-shadow:0 3px 0 #a56a00}
.tdt .buy:disabled{opacity:.45;cursor:not-allowed}
@keyframes tdlow{50%{opacity:.55}}
[hidden]{display:none!important}
.ch-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:12px}
.chlv{--c:#5be68a;--c2:#1fae5a;--tc:#022b14;text-align:left;display:grid;gap:6px;padding:18px;border-radius:22px;border:3px solid rgba(0,0,0,.25);background:linear-gradient(165deg,var(--c),var(--c2));color:var(--tc);cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s;font:400 15px var(--body,inherit)}
.chlv:hover:not(:disabled){transform:translateY(-2px)}.chlv:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.chlv:disabled{opacity:.5;cursor:not-allowed}
.chlv b{font:400 26px/1.1 var(--disp)}.chlv .chi{font-size:40px;line-height:1}.chlv em{font-style:normal;font-weight:800;font-size:13px;opacity:.85}
.chlv .go{margin-top:4px;font:400 17px var(--disp);background:rgba(255,255,255,.55);border-radius:12px;padding:8px 12px;text-align:center}
.chlv.l1{--c:#ffc15e;--c2:#ff8a1f;--tc:#3a1c00}.chlv.l2{--c:#ff8fb1;--c2:#d63a7a;--tc:#3a0019}
.chboard{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,520px);aspect-ratio:1;border:4px solid #ffc21a;border-radius:10px;overflow:hidden;margin-bottom:10px;user-select:none}
.chsq{display:flex;align-items:center;justify-content:center;font-size:min(7.6vw,42px);line-height:1;cursor:pointer;position:relative}
.chsq.l{background:#bdf3c8}.chsq.d{background:#2fae72}.chsq.sel{outline:4px solid #ffc21a;outline-offset:-4px}
.chsq.mv::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(255,194,26,.85);position:absolute}
.chsq.cap::after{content:"";inset:6%;border-radius:50%;border:4px solid rgba(255,90,70,.9);position:absolute}
.chsq.last{box-shadow:inset 0 0 0 100px rgba(255,230,90,.35)}
.chw{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 3px #000}.chb{color:#0a2a33}
.side-body{position:absolute;top:calc(100% + 8px);right:0;width:min(360px,100%);max-height:calc(100vh - 130px);overflow:auto;background:rgba(3,34,54,.98);color:#fff;border:3px solid var(--gold);border-radius:20px;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.3),0 16px 30px rgba(0,30,50,.4);text-align:left}
.side-body h3{margin:0 0 8px;font:400 18px var(--disp);color:#ffe066}
.st-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.15);font-size:14px}
.st-bar{grid-column:1/-1;height:6px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}.st-bar i{display:block;height:100%;background:#ffc21a}
.mk h3{margin:0;font:400 17px/1.25 var(--disp)}
.hand{display:flex;gap:10px;flex-wrap:wrap;min-height:90px;align-items:center;perspective:600px}
.pc{width:56px;height:80px;background:linear-gradient(160deg,#fff,var(--card));color:var(--cardink);border-radius:10px;display:grid;place-items:center;font:400 24px var(--disp);box-shadow:0 5px 0 #b9b08a,0 10px 14px rgba(0,0,0,.4);position:relative;transform:rotateX(14deg);transition:transform .15s;border:2px solid #1a1a2e}
.pc.r{color:var(--red)}
.pc.back{background:repeating-linear-gradient(45deg,#14b3a0 0 7px,#ffb01f 7px 14px);color:transparent;border:3px solid #fff0a8}
.pc small{position:absolute;bottom:5px;font-size:17px}
.pc.held{outline:4px solid var(--gold);transform:translateY(-8px) rotateX(0)}
button.pc{cursor:pointer}
button.pc:hover:not(:disabled){transform:translateY(-4px) rotateX(4deg)}
.hold{font:400 13px var(--disp);height:18px;color:#ffe066;text-align:center;letter-spacing:.08em}
.msg{font:400 20px var(--disp);min-height:30px;margin:12px 0}
.win{color:var(--win)}.loss{color:var(--loss)}
.pay{font:700 13px var(--body);color:#e4f7ec;display:grid;grid-template-columns:auto auto;gap:3px 18px;width:max-content;max-width:100%}
.pay .hit{color:#ffe066;font-weight:800}
.how{background:rgba(0,0,0,.32);border-radius:16px;padding:12px 16px;margin:0 0 16px;font-weight:700;line-height:1.5}
.how summary{font:400 17px var(--disp);color:#ffe066;cursor:pointer}
.how h3{font:400 14px var(--disp);color:#ffe066;margin:14px 0 4px;letter-spacing:.06em;text-transform:uppercase}
.how ol,.how ul{margin:6px 0;padding-left:22px}
.how li{margin:4px 0}
.how .tbl{overflow-x:auto}
.how table{border-collapse:collapse;width:100%;min-width:420px;font-size:13px}
.how th,.how td{text-align:left;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.2);vertical-align:top}
.how th{color:#ffe066;font-family:var(--disp);font-weight:400}
.how td:last-child{white-space:nowrap;font-weight:800;color:var(--win)}
.chart{position:relative;height:96px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.16);border-radius:12px;overflow:hidden}
.chart .cv{position:absolute;inset:0}
.chart svg{display:block;width:100%;height:100%}
.chart .yh,.chart .yl{position:absolute;left:6px;font:800 10px var(--body);color:#9ee6cf}
.chart .yh{top:4px}.chart .yl{bottom:4px}
.chart .ys{position:absolute;right:6px;font:800 10px var(--body);color:#ffd34d;transform:translateY(-105%)}
.live{font:400 15px var(--disp)}
.live .lp{color:#fff4d6}
.live .up{color:#7dffb0}.live .dn{color:#ff9a8a}
.cx{display:flex;justify-content:space-between;font:800 11px var(--body);color:#9ee6cf;margin-top:-3px}
.btn.buy{display:grid;gap:1px;text-align:left;padding:7px 12px;line-height:1.15;flex:1;min-width:130px;font-size:15px}
.btn.buy small{font:800 11px var(--body);opacity:.85}
.btn.buy.no{background:linear-gradient(180deg,#ff8a73,#ff4a38);border-color:#ffb3a5;color:#fff;box-shadow:0 4px 0 #a82618,0 8px 14px rgba(0,0,0,.3)}
.btn.buy.no:active:not(:disabled){box-shadow:0 1px 0 #a82618}
.mk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.px{display:flex;height:36px;border-radius:12px;overflow:hidden;font:400 15px var(--disp);color:#fff;border:2px solid rgba(0,0,0,.35)}
.px div{display:flex;align-items:center;padding:0 10px;transition:width .5s;min-width:70px;white-space:nowrap}
.px .y{background:linear-gradient(180deg,#3fe6d2,#14b3a0);color:#032f2a}.px .n{background:linear-gradient(180deg,#ff8a73,#ff4a38);justify-content:flex-end}
.pos{font:700 13px var(--body);color:#e4f7ec}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:#0b3f4d;color:var(--txt);border:3px solid var(--gold);padding:11px 22px;border-radius:99px;opacity:0;transition:.3s;z-index:40;max-width:90vw;text-align:center;font:400 17px var(--disp);box-shadow:0 6px 0 var(--gold-d),0 16px 30px rgba(0,25,45,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:28px;font:800 12px var(--body);color:#3a1500;text-align:center}
@media(max-width:820px){.desk{grid-template-columns:1fr}.bal b{font-size:26px}.bar{border-radius:26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
